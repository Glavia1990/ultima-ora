<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Ultima Ora</title><meta name="theme-color" content="#0c0b0a">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Ultima Ora">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0c0b0a;--card:#17140f;--gold:#c9a24b;--red:#a8262b;--txt:#e9e2d0;--mute:#8d8574}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 -apple-system,system-ui,sans-serif}
body{background:radial-gradient(ellipse at top,#231c12 0,#0c0b0a 70%) fixed;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 20px)}
h3,.logo,.title2,.sname,.score{font-family:"Playfair Display",Georgia,"Times New Roman",serif}
h3{color:var(--gold);font-weight:normal;letter-spacing:.08em;text-transform:uppercase;font-size:14px;margin:20px 0 8px}
.home{text-align:center;padding-top:12vh}.logo{font-size:56px;line-height:.95;letter-spacing:.12em;color:var(--txt)}.logo span{color:var(--red)}
.small2{font-size:26px;color:var(--gold)}.tag{color:var(--mute);font-style:italic;margin:24px 0 36px;font-family:Georgia,serif}
.btn{display:block;width:100%;padding:15px;margin:10px 0;border:1px solid var(--gold);background:transparent;color:var(--gold);font:600 16px Georgia,serif;letter-spacing:.1em;text-transform:uppercase;border-radius:4px}
.btn.gold{background:var(--gold);color:#120f0a}.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.how{text-align:left;color:var(--mute);margin-top:24px;font-size:14px}.how summary{color:var(--gold)}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #3a3020;padding-bottom:8px}
.title2{font-size:22px}.small{font-size:12px;color:var(--mute)}.center{text-align:center}.red{color:#e0484e!important}
.clock{font:700 24px Georgia,serif;color:var(--gold)}
nav{display:flex;gap:4px;margin:10px 0;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:2}
.tab{flex:1;padding:10px 2px;background:var(--card);border:1px solid #2c261b;color:var(--mute);font-size:13px;border-radius:4px}.tab.on{color:var(--bg);background:var(--gold)}
.intro{background:var(--card);border-left:3px solid var(--red);padding:10px 14px;font-family:Georgia,serif;font-style:italic}
.item{display:flex;justify-content:space-between;width:100%;text-align:left;padding:13px;margin:6px 0;background:var(--card);border:1px solid #2c261b;color:var(--txt);border-radius:4px;font-size:15px}
.item.done,.q.done{opacity:.5}.cost{color:var(--gold);white-space:nowrap;margin-left:8px}
.sus{background:var(--card);border:1px solid #2c261b;border-radius:6px;padding:12px;margin:10px 0;display:grid;grid-template-columns:48px 1fr;gap:10px}
.avatar{width:48px;height:48px;border-radius:50%;background:#2a2116;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:Georgia}
.sname{font-size:19px}.qs{grid-column:1/3;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.q{padding:9px 6px;background:#0f0d0a;border:1px solid #3a3020;color:var(--txt);border-radius:4px;font-size:13px}.q i{color:var(--gold)}
.note{background:var(--card);padding:10px 12px;margin:8px 0;border-left:3px solid var(--gold);font-size:14px}.note.dich{border-color:var(--red);font-style:italic}.ntit{font-style:normal;color:var(--gold);font-size:12px;margin-bottom:4px}
.acc label{display:block;color:var(--gold);margin:14px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
select{width:100%;padding:12px;background:var(--card);color:var(--txt);border:1px solid #3a3020;border-radius:4px;font-size:16px}
.end{text-align:center}.end p{text-align:left}.score{font-size:60px;color:var(--gold)}.score span{font-size:18px}.res{list-style:none;padding:0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}#modal[hidden]{display:none}
#modal .card{background:var(--card);border:1px solid var(--gold);padding:20px;border-radius:6px;max-width:460px;font-family:Georgia,serif}
</style></head><body><div id="app"></div><div id="modal" hidden></div><script src="game.js"></script></body></html>
